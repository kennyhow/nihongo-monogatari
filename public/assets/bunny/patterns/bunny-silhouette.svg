<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Bunny Silhouette Pattern</title>
  <desc>Minimalist bunny silhouette for background patterns and repeats</desc>

  <!-- Simple bunny silhouette -->
  <g fill="#2d3436">
    <!-- Left ear -->
    <ellipse cx="32" cy="25" rx="6" ry="18"/>

    <!-- Right ear -->
    <ellipse cx="68" cy="25" rx="6" ry="18"/>

    <!-- Head -->
    <circle cx="50" cy="55" r="22"/>

    <!-- Body -->
    <ellipse cx="50" cy="82" rx="18" ry="14"/>
  </g>
</svg>
