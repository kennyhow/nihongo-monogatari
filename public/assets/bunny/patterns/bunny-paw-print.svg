<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Bunny Paw Print Pattern</title>
  <desc>Cute bunny paw print with main pad and four toe pads for borders and dividers</desc>

  <g fill="#2d3436">
    <!-- Main paw pad -->
    <ellipse cx="50" cy="70" rx="20" ry="15"/>

    <!-- Top left toe pad -->
    <ellipse cx="30" cy="45" rx="10" ry="12" transform="rotate(-15 30 45)"/>

    <!-- Top middle-left toe pad -->
    <ellipse cx="42" cy="38" rx="10" ry="12" transform="rotate(-5 42 38)"/>

    <!-- Top middle-right toe pad -->
    <ellipse cx="58" cy="38" rx="10" ry="12" transform="rotate(5 58 38)"/>

    <!-- Top right toe pad -->
    <ellipse cx="70" cy="45" rx="10" ry="12" transform="rotate(15 70 45)"/>
  </g>
</svg>
