<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Usagi-san Sleeping</title>
  <desc>A cute white bunny mascot sleeping peacefully with closed eyes and Zzz symbols</desc>

  <!-- Left Ear - Slightly Droopy -->
  <ellipse cx="65" cy="48" rx="18" ry="40" fill="#ffffff" transform="rotate(-18 65 48)"/>
  <ellipse cx="65" cy="51" rx="10" ry="30" fill="#f4a8b8" transform="rotate(-18 65 51)"/>

  <!-- Right Ear - Slightly Droopy -->
  <ellipse cx="135" cy="48" rx="18" ry="40" fill="#ffffff" transform="rotate(18 135 48)"/>
  <ellipse cx="135" cy="51" rx="10" ry="30" fill="#f4a8b8" transform="rotate(18 135 51)"/>

  <!-- Body -->
  <ellipse cx="100" cy="150" rx="50" ry="45" fill="#ffffff"/>

  <!-- Head -->
  <circle cx="100" cy="95" r="45" fill="#ffffff"/>

  <!-- Red Hachimaki (Japanese Headband) - Slightly Loose -->
  <rect x="52" y="75" width="96" height="18" rx="4" fill="#e74c3c"/>
  <rect x="85" y="72" width="30" height="24" rx="3" fill="#c0392b"/>

  <!-- Hachimaki Tails - Limp -->
  <path d="M 52 84 Q 38 82 35 92 Q 33 96 36 94 Q 42 90 52 88" fill="#c0392b" opacity="0.8"/>
  <path d="M 148 84 Q 162 82 165 92 Q 167 96 164 94 Q 158 90 148 88" fill="#c0392b" opacity="0.8"/>

  <!-- Eyes - Closed (Peaceful Curved Lines) -->
  <path d="M 76 90 Q 85 85 94 90" stroke="#2d3436" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 106 90 Q 115 85 124 90" stroke="#2d3436" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="100" cy="100" rx="6" ry="4" fill="#f4a8b8"/>

  <!-- Mouth - Small Peaceful Smile -->
  <path d="M 100 104 Q 95 108 90 106" stroke="#2d3436" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100 104 Q 105 108 110 106" stroke="#2d3436" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="55" y1="95" x2="75" y2="98" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="102" x2="75" y2="103" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  <line x1="125" y1="98" x2="145" y2="95" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  <line x1="125" y1="103" x2="145" y2="102" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>

  <!-- Blush Cheeks (Sleeping) -->
  <ellipse cx="72" cy="98" rx="7" ry="4" fill="#f4a8b8" opacity="0.5"/>
  <ellipse cx="128" cy="98" rx="7" ry="4" fill="#f4a8b8" opacity="0.5"/>

  <!-- Arms - Relaxed at Sides -->
  <ellipse cx="60" cy="150" rx="12" ry="20" fill="#ffffff" transform="rotate(-15 60 150)"/>
  <ellipse cx="140" cy="150" rx="12" ry="20" fill="#ffffff" transform="rotate(15 140 150)"/>

  <!-- Small Cotton Tail -->
  <circle cx="100" cy="185" r="8" fill="#ffffff"/>

  <!-- Zzz Symbols -->
  <!-- First Z -->
  <text x="150" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#7f8c8d" opacity="0.7">Z</text>
  <!-- Second Z -->
  <text x="165" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#95a5a6" opacity="0.6">Z</text>
  <!-- Third Z -->
  <text x="178" y="12" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#bdc3c7" opacity="0.5">Z</text>

  <!-- Small Sleep Bubble -->
  <circle cx="145" cy="55" r="3" fill="none" stroke="#bdc3c7" stroke-width="1.5" opacity="0.4"/>
  <circle cx="158" cy="42" r="2" fill="none" stroke="#bdc3c7" stroke-width="1" opacity="0.3"/>
</svg>
