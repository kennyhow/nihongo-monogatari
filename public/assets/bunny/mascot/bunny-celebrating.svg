<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Usagi-san Celebrating</title>
  <desc>A cute white bunny mascot jumping with arms raised in celebration</desc>

  <!-- Confetti -->
  <circle cx="25" cy="40" r="4" fill="#e74c3c"/>
  <circle cx="175" cy="35" r="3" fill="#f39c12"/>
  <circle cx="40" cy="170" r="3.5" fill="#3498db"/>
  <circle cx="160" cy="165" r="4" fill="#26a668"/>
  <circle cx="30" cy="100" r="3" fill="#9b59b6"/>
  <circle cx="170" cy="100" r="3.5" fill="#f1c40f"/>
  <rect x="50" y="30" width="6" height="6" fill="#e91e63" transform="rotate(20 53 33)"/>
  <rect x="144" y="28" width="6" height="6" fill="#00bcd4" transform="rotate(-15 147 31)"/>
  <rect x="20" y="140" width="5" height="5" fill="#8bc34a" transform="rotate(35 22 142)"/>
  <rect x="175" y="145" width="5" height="5" fill="#ff5722" transform="rotate(-25 177 147)"/>

  <!-- Left Ear -->
  <ellipse cx="65" cy="35" rx="18" ry="40" fill="#ffffff" transform="rotate(-20 65 35)"/>
  <ellipse cx="65" cy="38" rx="10" ry="30" fill="#f4a8b8" transform="rotate(-20 65 38)"/>

  <!-- Right Ear -->
  <ellipse cx="135" cy="35" rx="18" ry="40" fill="#ffffff" transform="rotate(20 135 35)"/>
  <ellipse cx="135" cy="38" rx="10" ry="30" fill="#f4a8b8" transform="rotate(20 135 38)"/>

  <!-- Body (Jumping - Dynamic Pose) -->
  <ellipse cx="100" cy="135" rx="48" ry="42" fill="#ffffff"/>

  <!-- Head -->
  <circle cx="100" cy="75" r="45" fill="#ffffff"/>

  <!-- Red Hachimaki (Japanese Headband) - Flowing -->
  <rect x="50" y="55" width="100" height="18" rx="4" fill="#e74c3c"/>
  <rect x="83" y="52" width="34" height="24" rx="3" fill="#c0392b"/>

  <!-- Hachimaki Tails - Flowing Upward -->
  <path d="M 50 64 Q 30 55 25 40 Q 23 35 28 38 Q 38 50 50 60" fill="#e74c3c"/>
  <path d="M 150 64 Q 170 55 175 40 Q 177 35 172 38 Q 162 50 150 60" fill="#e74c3c"/>

  <!-- Eyes - Excited/Happy -->
  <ellipse cx="83" cy="70" rx="9" ry="11" fill="#2d3436"/>
  <ellipse cx="117" cy="70" rx="9" ry="11" fill="#2d3436"/>
  <!-- Eye Highlights -->
  <circle cx="86" cy="67" r="3.5" fill="#ffffff"/>
  <circle cx="120" cy="67" r="3.5" fill="#ffffff"/>
  <!-- Stars in Eyes -->
  <path d="M 89 73 L 90 75 L 92 75 L 90 76 L 91 78 L 89 77 L 87 78 L 88 76 L 86 75 L 88 75 Z" fill="#ffffff"/>
  <path d="M 123 73 L 124 75 L 126 75 L 124 76 L 125 78 L 123 77 L 121 78 L 122 76 L 120 75 L 122 75 Z" fill="#ffffff"/>

  <!-- Nose -->
  <ellipse cx="100" cy="82" rx="6" ry="4" fill="#f4a8b8"/>

  <!-- Mouth - Big Celebrating Smile -->
  <path d="M 100 86 Q 90 96 78 92" stroke="#2d3436" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 100 86 Q 110 96 122 92" stroke="#2d3436" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Whiskers - Excited -->
  <line x1="52" y1="75" x2="73" y2="78" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="82" x2="73" y2="83" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  <line x1="127" y1="78" x2="148" y2="75" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  <line x1="127" y1="83" x2="148" y2="82" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>

  <!-- Arms Raised Up -->
  <ellipse cx="55" cy="95" rx="12" ry="22" fill="#ffffff" transform="rotate(-45 55 95)"/>
  <ellipse cx="145" cy="95" rx="12" ry="22" fill="#ffffff" transform="rotate(45 145 95)"/>

  <!-- Paws - Raised High -->
  <ellipse cx="40" cy="75" rx="10" ry="14" fill="#ffffff" transform="rotate(-30 40 75)"/>
  <ellipse cx="160" cy="75" rx="10" ry="14" fill="#ffffff" transform="rotate(30 160 75)"/>

  <!-- Legs - Jumping -->
  <ellipse cx="80" cy="170" rx="12" ry="18" fill="#ffffff" transform="rotate(-15 80 170)"/>
  <ellipse cx="120" cy="170" rx="12" ry="18" fill="#ffffff" transform="rotate(15 120 170)"/>

  <!-- Small Cotton Tail -->
  <circle cx="100" cy="172" r="8" fill="#ffffff"/>
</svg>
