<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Usagi-san Happy</title>
  <desc>A cute white bunny mascot with a big smile, waving happily with thumbs up gesture</desc>

  <!-- Left Ear -->
  <ellipse cx="65" cy="42" rx="18" ry="40" fill="#ffffff" transform="rotate(-15 65 42)"/>
  <ellipse cx="65" cy="45" rx="10" ry="30" fill="#f4a8b8" transform="rotate(-15 65 45)"/>

  <!-- Right Ear -->
  <ellipse cx="135" cy="42" rx="18" ry="40" fill="#ffffff" transform="rotate(15 135 42)"/>
  <ellipse cx="135" cy="45" rx="10" ry="30" fill="#f4a8b8" transform="rotate(15 135 45)"/>

  <!-- Body -->
  <ellipse cx="100" cy="150" rx="50" ry="45" fill="#ffffff"/>

  <!-- Head -->
  <circle cx="100" cy="95" r="45" fill="#ffffff"/>

  <!-- Red Hachimaki (Japanese Headband) -->
  <rect x="52" y="75" width="96" height="18" rx="4" fill="#e74c3c"/>
  <rect x="85" y="72" width="30" height="24" rx="3" fill="#c0392b"/>

  <!-- Hachimaki Tails -->
  <path d="M 52 84 Q 35 80 30 95 Q 28 100 32 98 Q 40 92 52 90" fill="#e74c3c"/>
  <path d="M 148 84 Q 165 80 170 95 Q 172 100 168 98 Q 160 92 148 90" fill="#e74c3c"/>

  <!-- Eyes - Happy Curved Lines (Closed/Joyful) -->
  <path d="M 75 88 Q 85 82 95 88" stroke="#2d3436" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 105 88 Q 115 82 125 88" stroke="#2d3436" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="100" cy="98" rx="6" ry="4" fill="#f4a8b8"/>

  <!-- Mouth - Extra Big Happy Smile -->
  <path d="M 100 102 Q 88 118 70 112" stroke="#2d3436" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 100 102 Q 112 118 130 112" stroke="#2d3436" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Blush Cheeks -->
  <ellipse cx="70" cy="100" rx="8" ry="5" fill="#f4a8b8" opacity="0.6"/>
  <ellipse cx="130" cy="100" rx="8" ry="5" fill="#f4a8b8" opacity="0.6"/>

  <!-- Whiskers -->
  <line x1="55" y1="95" x2="75" y2="98" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="102" x2="75" y2="103" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  <line x1="125" y1="98" x2="145" y2="95" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
  <line x1="125" y1="103" x2="145" y2="102" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Arm - Thumbs Up -->
  <ellipse cx="55" cy="130" rx="12" ry="22" fill="#ffffff" transform="rotate(-30 55 130)"/>
  <ellipse cx="35" cy="110" rx="10" ry="16" fill="#ffffff" transform="rotate(-40 35 110)"/>
  <!-- Thumbs Up Hand Details -->
  <ellipse cx="30" cy="100" rx="6" ry="10" fill="#ffffff"/>

  <!-- Right Arm - Waving -->
  <ellipse cx="145" cy="100" rx="12" ry="22" fill="#ffffff" transform="rotate(50 145 100)"/>
  <ellipse cx="165" cy="70" rx="10" ry="16" fill="#ffffff" transform="rotate(30 165 70)"/>
  <!-- Waving Paw Details -->
  <ellipse cx="172" cy="60" rx="8" ry="12" fill="#ffffff"/>

  <!-- Motion Lines for Waving -->
  <path d="M 175 45 Q 178 40 175 35" stroke="#95a5a6" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M 180 50 Q 185 45 183 38" stroke="#95a5a6" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M 183 55 Q 190 50 188 42" stroke="#95a5a6" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Small Cotton Tail -->
  <circle cx="100" cy="185" r="8" fill="#ffffff"/>
</svg>
