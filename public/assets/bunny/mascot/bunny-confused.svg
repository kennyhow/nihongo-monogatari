<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Usagi-san Confused</title>
  <desc>A cute white bunny mascot looking confused with question mark overhead</desc>

  <!-- Big Question Mark Overhead -->
  <text x="100" y="40" font-family="Arial, sans-serif" font-size="45" font-weight="bold" text-anchor="middle" fill="#95a5a6">?</text>

  <!-- Left Ear - One droopy -->
  <ellipse cx="65" cy="50" rx="18" ry="40" fill="#ffffff" transform="rotate(-8 65 50)"/>
  <ellipse cx="65" cy="53" rx="10" ry="30" fill="#f4a8b8" transform="rotate(-8 65 53)"/>

  <!-- Right Ear - Perked up -->
  <ellipse cx="135" cy="42" rx="18" ry="40" fill="#ffffff" transform="rotate(8 135 42)"/>
  <ellipse cx="135" cy="45" rx="10" ry="30" fill="#f4a8b8" transform="rotate(8 135 45)"/>

  <!-- Body -->
  <ellipse cx="100" cy="152" rx="50" ry="43" fill="#ffffff"/>

  <!-- Head - Slightly Tilted -->
  <circle cx="100" cy="95" r="45" fill="#ffffff" transform="rotate(-5 100 95)"/>

  <!-- Red Hachimaki (Japanese Headband) -->
  <rect x="52" y="75" width="96" height="18" rx="4" fill="#e74c3c"/>
  <rect x="85" y="72" width="30" height="24" rx="3" fill="#c0392b"/>

  <!-- Hachimaki Tails -->
  <path d="M 52 84 Q 35 80 30 95 Q 28 100 32 98 Q 40 92 52 90" fill="#e74c3c"/>
  <path d="M 148 84 Q 165 80 170 95 Q 172 100 168 98 Q 160 92 148 90" fill="#e74c3c"/>

  <!-- Eyes - Confused (Different Sizes) -->
  <circle cx="85" cy="92" r="8" fill="#2d3436"/>
  <ellipse cx="117" cy="90" rx="6" ry="8" fill="#2d3436"/>
  <!-- Eye Highlights -->
  <circle cx="87" cy="90" r="3" fill="#ffffff"/>
  <circle cx="118" cy="88" r="2.5" fill="#ffffff"/>

  <!-- Nose -->
  <ellipse cx="100" cy="103" rx="5" ry="3.5" fill="#f4a8b8"/>

  <!-- Mouth - Confused Wavy Mouth -->
  <path d="M 95 108 Q 100 110 105 108" stroke="#2d3436" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Whiskers - Asymmetrical -->
  <line x1="55" y1="95" x2="73" y2="97" stroke="#2d3436" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="101" x2="73" y2="102" stroke="#2d3436" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="127" y1="97" x2="145" y2="95" stroke="#2d3436" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Arms - Shrugging Position -->
  <ellipse cx="60" cy="140" rx="12" ry="18" fill="#ffffff" transform="rotate(-35 60 140)"/>
  <ellipse cx="140" cy="140" rx="12" ry="18" fill="#ffffff" transform="rotate(35 140 140)"/>

  <!-- Small Cotton Tail -->
  <circle cx="100" cy="188" r="8" fill="#ffffff"/>
</svg>
