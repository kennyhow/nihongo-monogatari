<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Usagi-san - Nihongo Monogatari Bunny Mascot</title>
  <desc>A cute white bunny face on a spring green background</desc>

  <!-- Background - Spring Green -->
  <rect width="100" height="100" rx="20" fill="#26a668"/>

  <!-- Bunny Ears -->
  <ellipse cx="30" cy="30" rx="12" ry="25" fill="#ffffff" transform="rotate(-15 30 30)"/>
  <ellipse cx="70" cy="30" rx="12" ry="25" fill="#ffffff" transform="rotate(15 70 30)"/>

  <!-- Pink Inner Ears -->
  <ellipse cx="30" cy="32" rx="7" ry="18" fill="#f4a8b8" transform="rotate(-15 30 32)"/>
  <ellipse cx="70" cy="32" rx="7" ry="18" fill="#f4a8b8" transform="rotate(15 70 32)"/>

  <!-- Bunny Face -->
  <circle cx="50" cy="55" r="28" fill="#ffffff"/>

  <!-- Eyes -->
  <circle cx="40" cy="50" r="5" fill="#2d3436"/>
  <circle cx="60" cy="50" r="5" fill="#2d3436"/>
  <!-- Eye Highlights -->
  <circle cx="42" cy="48" r="2" fill="#ffffff"/>
  <circle cx="62" cy="48" r="2" fill="#ffffff"/>

  <!-- Nose -->
  <ellipse cx="50" cy="58" rx="4" ry="3" fill="#f4a8b8"/>

  <!-- Mouth -->
  <path d="M 50 61 Q 46 65 42 63" stroke="#2d3436" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 50 61 Q 54 65 58 63" stroke="#2d3436" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="25" y1="55" x2="38" y2="57" stroke="#2d3436" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25" y1="60" x2="38" y2="60" stroke="#2d3436" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="57" x2="75" y2="55" stroke="#2d3436" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="60" x2="75" y2="60" stroke="#2d3436" stroke-width="1.5" stroke-linecap="round"/>
</svg>
